<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <style>
        /* Reset and full screen setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        header {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        /* Make the video cover the entire viewport (controls removed to use custom buttons) */
        #videoPlayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Style and position the heading on top of the video */
        h1 {
            position: relative;
            z-index: 2;
            color: #ffffff;
            font-size: 3rem;
            text-align: center;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.7);
            transition: opacity 1s ease, transform 1s ease;
        }

        /* Class added via JavaScript to trigger the disappear effect */
        h1.hidden {
            opacity: 0;
            transform: translateY(-50px);
            pointer-events: none;
        }

        /* Style for control buttons */
        .controls-container {
            position: absolute;
            bottom: 40px;
            z-index: 3;
            display: flex;
            gap: 15px;
        }

        .btn {
            background-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            -webkit-backdrop-filter: blur(5px);
            backdrop-filter: blur(5px);
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .btn:hover {
            background-color: rgba(255, 255, 255, 0.5);
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <header>
        <!-- Removed default controls to use custom buttons -->
        <video id="videoPlayer" loop autoplay muted>
            <source src="video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        
        <h1>Welcome to the Video Player</h1>

        <!-- Custom Play and Pause Buttons -->
        <div class="controls-container">
            <button class="btn" onclick="playVideo()" id="playBtn">Play</button>
            <button class="btn" onclick="pauseVideo()" id="pauseBtn">Pause</button>
        </div>
    </header>
    <script>
        const video = document.getElementById('videoPlayer');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const heading = document.querySelector('h1');

        // Function to hide the heading after 3 seconds
        setTimeout(() => {
            heading.classList.add('hidden');
        }, 500);
        //pause btn
        function pauseVideo() {
            video.pause();
        }
        function playVideo() {
            video.play();
        }
    </script>
</body>
</html>
